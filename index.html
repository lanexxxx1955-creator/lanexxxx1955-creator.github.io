  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var CANDLE_W = 14 * dpr, GAP = 6 * dpr, STEP = CANDLE_W + GAP, SPEED = 0.35 * dpr;
  var candles = [], price = 0.5, offset = 0, W = 0, H = 0;
  function nextCandle() {
    var drift = (Math.random() - 0.485) * 0.11;
    var open = price;

    W = canvas.clientWidth * dpr; H = canvas.clientHeight * dpr;

  }
  function y(v) { return H * (1 - v); }

    ctx.clearRect(0, 0, W, H);

      ctx.beginPath(); ctx.moveTo(0, (H / 8) * g); ctx.lineTo(W, (H / 8) * g); ctx.stroke();

      var c = candles[i], x = i * STEP - offset, up = c.c >= c.o;

    '<div class="coin-face">' + face('bear', 'bear') + '<div class="coin-sheen"></div></div></div>' +
    '</div></button></div><div class="coin-shadow"></div>';
  host.appendChild(toss);

  /* ---------- flip logic ---------- */
  var coinEl = document.getElementById('coin');
  var banner = document.getElementById('banner');
  var ctaWrap = document.getElementById('ctaWrap');
  var ctaTitle = document.getElementById('ctaTitle');
  var statBuy = document.getElementById('statBuy');
  var statSell = document.getElementById('statSell');
  var historyEl = document.getElementById('history');
  var footerRef = document.getElementById('footerRef');
  var creditSep = document.getElementById('creditSep');
  var rotation = 0, spinning = false, result = null, dismissed = false;
  var stats = { buy: 0, sell: 0 }, hist = [];

  document.querySelector('.coin-scene').addEventListener('click', flip);
  document.getElementById('ctaBtn').addEventListener('click', openReferral);
  footerRef.addEventListener('click', openReferral);
  document.getElementById('ctaClose').addEventListener('click', function () {
    dismissed = true; ctaWrap.hidden = true;
    footerRef.hidden = false; creditSep.hidden = false;
  });

  function flip() {
    if (spinning) return;
    var res = Math.random() < 0.5 ? 'buy' : 'sell';
    var mod = ((rotation % 360) + 360) % 360;
    var faceAngle = res === 'buy' ? 0 : 180;
    var delta = (faceAngle - mod + 360) % 360;
    var spins = 6 + Math.floor(Math.random() * 4);
    rotation += spins * 360 + delta;
    var dur = 2.4 + Math.random() * 1.1;

    spinning = true; result = null;
    ctaWrap.hidden = true;
    banner.innerHTML = '<p class="hint">Крутится…</p>';
    toss.style.setProperty('--spin-duration', dur + 's');
    toss.classList.remove('coin-toss-active');
    void toss.offsetWidth; /* restart toss animation */
    coinEl.style.transitionDuration = dur + 's';
    coinEl.style.transform = 'rotateY(' + rotation + 'deg)';
    toss.classList.add('coin-toss-active');

    if (!haptic('impactOccurred', 'medium') && navigator.vibrate) navigator.vibrate(30);

    setTimeout(function () {
      spinning = false; result = res;
      toss.classList.remove('coin-toss-active');
      stats[res]++;
      statBuy.textContent = stats.buy; statSell.textContent = stats.sell;
      hist.push(res); if (hist.length > 14) hist.shift();
      historyEl.innerHTML = hist.map(function (h, i) {
        return '<span class="hdot ' + (h === 'buy' ? 'b' : 's') + (i === hist.length - 1 ? ' last' : '') + '">' +
          (h === 'buy' ? 'B' : 'S') + '</span>';
      }).join('');
      banner.innerHTML =
        '<div class="result result-pop ' + res + '"><span class="emoji">' + (res === 'buy' ? '🐂' : '🐻') + '</span>' +
        '<span class="word">' + (res === 'buy' ? 'BUY' : 'SELL') + '</span></div>';
      if (!haptic('notificationOccurred', res === 'buy' ? 'success' : 'warning') && navigator.vibrate) {
        navigator.vibrate([40, 40, 40]);
      }
      if (!dismissed) {
        setTimeout(function () {
          if (!result || dismissed) return;
          ctaTitle.textContent = (result === 'buy' ? 'Монета сказала BUY 🐂' : 'Монета сказала SELL 🐻') + ' — время действовать';
          ctaWrap.hidden = false;
        }, 1100);
      }
    }, dur * 1000 + 80);
  }
})();
</script>
</body>
</html>
